apiVersion: argoproj.io/v1alpha1 
kind: Application 
metadata: { name: podinfo, namespace: argocd } 
spec: 
  project: default 
  destination: 
    server: https://kubernetes.default.svc 
    namespace: gitops 
  sources: 
    - repoURL: https://stefanprodan.github.io/podinfo 
      chart: podinfo 
      targetRevision: 6.15.0 
      helm: { valueFiles: [$values/apps/podinfo/values.yaml] } 
    - repoURL: https://github.com/rzwiers/k8s-gitops-lab.git 
      targetRevision: main 
      ref: values 
  syncPolicy: 
    automated: { prune: true, selfHeal: true } 
    syncOptions: [CreateNamespace=true]